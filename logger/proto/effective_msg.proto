// 日志消息的 protobuf 定义
syntax = "proto3";

option optimize_for = SPEED;  // 使用 SPEED 而不是 LITE_RUNTIME，保留调试能力

// 如果需要命名空间，可以添加：
// package logger;

message EffectiveMsg {
  int32 level = 1;           // 日志级别
  int64 timestamp = 2;       // 时间戳（毫秒）
  int32 pid = 3;             // 进程 ID
  int32 tid = 4;             // 线程 ID
  int32 line = 5;            // 源代码行号
  string file_name = 6;      // 源文件名
  string func_name = 7;      // 函数名
  string log_info = 8;       // 日志内容
}
